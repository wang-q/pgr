[build-dependencies]

[dev-dependencies]
calamine = "0.26.1"
assert_cmd = "2.0.14"
predicates = "3.1.0"
approx = "0.5.1"
criterion = "0.5.1"
t1ha = "0.1"
wyhash = "0.5"
rust-lapper = "1.3"
rand = { version = "0.9.0", features = ["small_rng"] }
nalgebra = "0.34.1"

# jaccard benchmark
nohash-hasher = "0.2.0"
tinyset = { version = "0.5.1", default-features = false }
hnsw = "0.11.0"
space = "0.17.0"
rand_pcg = "0.3.1"

# ANN / sketch experiments (GSearch reference implementation)
hnsw_rs = "0.3"
probminhash = "0.1"

# SQLite vector-store comparison (sqlite-vector-rs: PGVector-like vtab + usearch HNSW;
# MIT/Apache-2.0; dev-dep only. NOTE: rqlite's "sqlite-vector" is Elastic-2.0 -> excluded,
# this crate is a different project with a compatible license.)
# `bundled` is required for library (non-loadable-extension) use: without a static
# feature the crate dispatches through a runtime API table that only SQLite fills
# when loading a .so; the host also lacks libsqlite3-dev, so bundle SQLite itself.
sqlite3-ext-vtab = { version = "0.2", features = ["bundled"] }
sqlite-vector-rs = "0.1"
linflate = "0.1.11"
isal-rs = "0.5.3"
isal-sys = "0.5.3"
miniz_oxide = "0.8"
noodles-bgzf = "0.45.0"
flate2 = "1.1.8"
noodles-fasta = "0.58.0"
noodles-fastq = "0.21.0"

[profile.release]
lto = true
