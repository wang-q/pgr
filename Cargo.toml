harness = false

[[bench]]
name = "syntenic_filter_benchmark"
harness = false

[[bench]]
name = "interval_overlap_benchmark"
harness = false

[[bench]]
name = "range_parse_benchmark"
harness = false

[[bench]]
name = "rg_merge_benchmark"
harness = false

[[bench]]
name = "kmer_benchmark"
harness = false

[[bench]]
name = "paf_index_benchmark"
harness = false

[[bench]]
name = "paf_graph_benchmark"
harness = false

[[bench]]
name = "simd_benchmark"
harness = false

[[bench]]
name = "jaccard_benchmark"
harness = false

[[bench]]
name = "hv_benchmark"
harness = false

[[bench]]
name = "hv_benchmark_ref"
harness = false

[[bench]]
name = "dist_sketch_benchmark"
harness = false

[[bench]]
name = "hv_ann_recall"
harness = false

[[bench]]
name = "hv_ann_hubnsw"
harness = false

[[bench]]
name = "hv_ann_clade"
harness = false

[[bench]]
name = "hv_ann_real"
harness = false

[[bench]]
name = "poa_benchmark"
harness = false

[[bench]]
name = "byte_stat_benchmark"
harness = false

[[bench]]
name = "twobit_benchmark"
harness = false

[[bench]]
name = "syncmer_benchmark"
harness = false

[[bench]]
name = "fracminhash_benchmark"
harness = false

[[bench]]
name = "minimizer_benchmark"
harness = false

[[bench]]
name = "fa_read_benchmark"
harness = false

[[bench]]
name = "seq_read_benchmark"
harness = false

[[bench]]
