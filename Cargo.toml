[package]
name = "pgr"
version = "0.5.0"
authors = ["wang-q <wang-q@outlook.com>"]
edition = "2021"
description = "Practical Genome Refiner"
documentation = "https://github.com/wang-q/pgr"
readme = "README.md"
homepage = "https://github.com/wang-q/pgr"
repository = "https://github.com/wang-q/pgr"
license = "MIT"
categories = ["command-line-utilities", "science"]
publish = false

[dependencies]
clap = { version = "4.5.28", features = ["cargo"] }
anyhow = "1.0.93"
regex = "1.11.1"
itertools = "0.14.0"
log = "0.4"
env_logger = "0.11"

crossbeam = "0.8.4"
rayon = "1.10.0"
cmd_lib = "1.9.6"

# data structure
petgraph = "0.7.1"
indexmap = "2.13.0"
lru = "0.13.0"

# hashing
rapidhash = { version = "1.4.0", features = ["rng"] }
fxhash = "0.2.1"
murmurhash3 = "0.0.5"
rand = { version = "0.9.0" }
minimizer-iter = "1.2.1"

coitrees = "0.4"
noodles-gff = "0.54.0"
memchr = "2.8.3"
bstr = "1.13.0"

memmap2 = "0.9"
which = "7.0.0"
tempfile = "3.14.0"

rust_xlsxwriter = "0.83.0"
bio = "0.30.1"
libdeflater = "1.25.2"
crc32fast = "1.5.0"
libz-ng-sys = "1.1.29"
tera = "1.20.1"
csv = "1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
wide = "1.6.0"

[[bin]]
name = "pgr"
path = "src/pgr.rs"

[[bench]]
name = "pbit_benchmark"
harness = false

[[bench]]
name = "bitmap_intspan_benchmark"
harness = false

[[bench]]
